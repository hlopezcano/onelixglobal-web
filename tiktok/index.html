<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Autorización de TikTok · OnelixGlobal</title>
<style>
  :root{--navy:#0F1B3D;--blue:#1848D8;--gold:#C9A24A;--muted:#5B6478}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:#F7F3EA;color:var(--navy);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:24px}
  .box{max-width:640px;width:100%}
  h1{font-size:22px;margin:0 0 6px}
  p{color:var(--muted);line-height:1.55;margin:0 0 14px}
  .code{display:block;word-break:break-all;background:#fff;border:1px solid #E3DCCB;border-radius:12px;
        padding:14px;font-family:ui-monospace,Consolas,monospace;font-size:14px;color:var(--navy);margin:0 0 14px}
  button{background:var(--blue);color:#fff;border:0;border-radius:999px;padding:12px 22px;font-weight:700;
         font-size:15px;cursor:pointer}
  .ok{color:#1F8A4C;font-weight:600}
  .eyebrow{letter-spacing:.16em;text-transform:uppercase;font-size:11px;color:var(--gold);font-weight:700;margin-bottom:10px;display:block}
</style>
</head>
<body>
<div class="box">
  <span class="eyebrow">OnelixGlobal · TikTok</span>
  <h1 id="titulo">Autorización recibida</h1>
  <p id="texto">Copia este código y pégalo en el asistente. Caduca en 10 minutos.</p>
  <code class="code" id="codigo">—</code>
  <button id="copiar">Copiar código</button>
  <p id="estado" style="margin-top:14px"></p>
</div>
<script>
  var p = new URLSearchParams(location.search);
  var code = p.get("code") || "";
  var err = p.get("error") || p.get("error_description") || "";
  var caja = document.getElementById("codigo");
  if (err) {
    document.getElementById("titulo").textContent = "TikTok devolvió un error";
    caja.textContent = err;
    document.getElementById("copiar").style.display = "none";
  } else if (code) {
    caja.textContent = code;
  } else {
    document.getElementById("titulo").textContent = "Falta el código";
    caja.textContent = "Abre esta página desde el enlace de autorización que te dio el asistente.";
  }
  document.getElementById("copiar").onclick = function () {
    if (!code) return;
    navigator.clipboard.writeText(code).then(function () {
      var e = document.getElementById("estado");
      e.textContent = "Copiado ✓";
      e.className = "ok";
    });
  };
</script>
</body>
</html>
