<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  :root { --marfil:#F6F4EF; --azul:#101A3C; --oro:#B98A2F; --texto:#1c1a18; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--marfil); color:var(--texto); font-family:"Sora",Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif; line-height:1.5; }
  header { background:var(--azul); color:var(--marfil); text-align:center; padding:32px 20px 26px; }
  header img { height:40px; margin-bottom:10px; }
  header h1 { font-size:20px; letter-spacing:.5px; }
  header p { color:#cdd4e6; font-size:14px; margin-top:4px; }
  main { max-width:460px; margin:0 auto; padding:20px 16px 32px; display:flex; flex-direction:column; gap:16px; }
  a.card { display:flex; gap:14px; background:#fff; border:1px solid #e6e0d4; border-radius:16px; padding:14px; text-decoration:none; color:inherit; box-shadow:0 2px 10px rgba(16,26,60,.06); align-items:center; }
  a.card img { width:96px; height:96px; object-fit:cover; border-radius:12px; flex-shrink:0; }
  a.card .info { display:flex; flex-direction:column; gap:6px; flex:1; }
  a.card h2 { font-size:17px; color:var(--azul); line-height:1.25; }
  a.card .precio { font-size:20px; font-weight:700; color:var(--oro); }
  a.card .btn { display:inline-block; background:var(--azul); color:#fff; font-weight:600; font-size:14px; padding:9px 14px; border-radius:8px; text-align:center; margin-top:2px; }
  a.card:hover { border-color:var(--oro); }
  footer { text-align:center; padding:0 20px 36px; color:#6b6b6b; font-size:13px; }
  footer strong { color:var(--azul); }
</style>
</head>
<body>
<header>
  <img src="../logo-onelix-horizontal-marfil.png" alt="OnelixGlobal">
  <h1>Productos útiles para el día a día</h1>
  <p>Pagas al recibir · Envíos a toda Colombia 🇨🇴</p>
</header>
<main>
  <a class="card" href="https://difusor.onelixglobal.com/">
    <img src="difusor.jpg" alt="Difusor de Aromas">
    <div class="info">
      <h2>Difusor de Aromas</h2>
      <p class="precio">$109.900</p>
      <span class="btn">Ver y pedir →</span>
    </div>
  </a>
  <a class="card" href="https://juguete-gato.onelixglobal.com/">
    <img src="juguete.jpg" alt="Juguete Interactivo para Gato">
    <div class="info">
      <h2>Juguete Interactivo para Gato</h2>
      <p class="precio">$29.900</p>
      <span class="btn">Ver y pedir →</span>
    </div>
  </a>
</main>
<footer>
  <strong>OnelixGlobal</strong> · Pago contra entrega · $10.000 de envío · Atención por WhatsApp
</footer>
</body>
